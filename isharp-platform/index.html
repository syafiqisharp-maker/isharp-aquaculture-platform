<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>iSHARP Aquaculture Platform — Enterprise Farm Intelligence</title>
    <!-- Modern Typography: Plus Jakarta Sans (Aero), Space Grotesk (Telemetry), Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/command-os.css">
    <link rel="stylesheet" href="src/styles/landing.css">
    <link rel="stylesheet" href="src/styles/field-ops-mobile.css">
    <link rel="stylesheet" href="style.css">

    <!-- PWA Web App Manifest & Apple Mobile Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Field Ops">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
</head>
<body>
    <!-- TOP-LEVEL VIEW 1: PORTAL LANDING PAGE -->
    <div id="view-portal" class="view-pane active-view"></div>

    <!-- TOP-LEVEL VIEW 2: EXECUTIVE DASHBOARD -->
    <div id="view-executive" class="view-pane" style="display: none;"></div>

    <!-- TOP-LEVEL VIEW 3: FIELD OPERATIONS -->
    <div id="view-field-ops" class="view-pane" style="display: none;"></div>

    <!-- TOP-LEVEL VIEW 4: OPERATIONAL DBMS -->
    <div id="view-dbms" class="view-pane" style="display: none;"></div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="toast-stack"></div>

    <!-- GLOBAL CENTRAL DBMS AUTHENTICATION MODAL -->
    <div id="modal-dbms-passcode" class="modal-backdrop hidden" role="dialog" aria-modal="true" style="z-index: 100000;">
        <div class="modal-dialog modal-glass" style="max-width: 400px; width: 92%; text-align: center; padding: 2rem 1.75rem; border-radius: 20px; box-shadow: 0 20px 50px rgba(2, 132, 199, 0.35);">
            <div style="width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff 0%, #38bdf8 60%, #0284c7 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.85rem auto; box-shadow: inset 0 2px 4px #ffffff, 0 6px 18px rgba(2, 132, 199, 0.35);">
                <span style="font-size: 1.6rem;">🔐</span>
            </div>
            <h3 style="margin: 0 0 0.35rem 0; font-size: 1.35rem; font-weight: 900; color: #0f172a;">iSHARP DBMS Access</h3>
            <p style="font-size: 0.82rem; color: #475569; margin-bottom: 1.25rem; line-height: 1.4;">
                Enter the universal <strong>Editor</strong> or <strong>Viewer</strong> access password to open the operations database.
            </p>
            
            <input type="password" id="input-dbms-passcode" class="form-control" placeholder="Enter password (e.g. mantaray)" autocomplete="off" style="font-size: 0.95rem; text-align: center; font-weight: 700; padding: 0.7rem 0.9rem; margin-bottom: 1.25rem; min-height: 46px; border: 2px solid #bae6fd; border-radius: 10px; letter-spacing: 0.05em; background: #ffffff; color: #0f172a;" />
            
            <div style="display: flex; gap: 0.65rem; justify-content: center;">
                <button type="button" id="btn-cancel-dbms-passcode" class="btn-action btn-secondary" style="font-size: 0.84rem; padding: 0.5rem 1.2rem; min-height: 44px; border-radius: 8px;">Cancel</button>
                <button type="button" id="btn-verify-dbms-passcode" class="btn-action btn-primary" style="font-size: 0.84rem; font-weight: 800; padding: 0.5rem 1.4rem; min-height: 44px; border-radius: 8px;">Unlock DBMS</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
