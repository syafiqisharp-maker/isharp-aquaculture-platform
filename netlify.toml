# Netlify Configuration for iSHARP Precision Aquaculture Platform

[build]
  base = "isharp-platform"
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) redirect rule
# Ensures any direct link (e.g. /#/executive or subpaths) routes correctly to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
# Content-hashed Vite assets are immutable and cached long-term
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# App shell and Service Worker must always revalidate to guarantee instant updates on new deploys
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.bluearchipelago.com; connect-src 'self' https://keappoukeagyzpoxkrru.supabase.co; worker-src 'self'; frame-ancestors 'self';"
